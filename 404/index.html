Answer\",\"text\":\"نقبل التحويل البنكي وبوابات الدفع الإلكتروني. تعمل المشاريع بنظام دفعات مرنة: 40% عند بدء التنفيذ، 30% عند تسليم النسخة الأولى، و30% عند التسليم النهائي. أما المشاريع الصغيرة فتُقسم 50/50.\"}},{\"@type\":\"Question\",\"name\":\"هل تصدرون فواتير رسمية معتمدة؟\",\"text\":\"هل تصدرون فواتير رسمية معتمدة؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"نعم، نصدر فاتورة ضريبية رسمية لكل عملية دفع وتصلك إلكترونياً فوراً، مع إمكانية إصدار مستندات إضافية تحتاجها شركتك لأغراض المحاسبة والمراجعة.\"}},{\"@type\":\"Question\",\"name\":\"ما سياسة الاسترجاع أو إلغاء المشروع؟\",\"text\":\"ما سياسة الاسترجاع أو إلغاء المشروع؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"يمكنك إلغاء المشروع في أي وقت؛ تُحسب قيمة الأعمال المنجزة فعلياً حتى تاريخ الإلغاء ويُسترد الفرق المتبقي تلقائياً خلال 7 أيام عمل — دون أي رسوم خفية أو شروط معقدة.\"}},{\"@type\":\"Question\",\"name\":\"هل تقدمون دعماً فنياً بعد التسليم؟\",\"text\":\"هل تقدمون دعماً فنياً بعد التسليم؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"نعم، كل مشروع يأتي مع دعم فني مجاني لمدة 30 يوماً بعد التسليم، وتتوفر بعدها عقود دعم شهرية مرنة تشمل المراقبة المستمرة والتحديثات والاستجابة السريعة للحالات الطارئة.\"}},{\"@type\":\"Question\",\"name\":\"ماذا يشمل عقد الصيانة الشهرية؟\",\"text\":\"ماذا يشمل عقد الصيانة الشهرية؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"يشمل النسخ الاحتياطي التلقائي الدوري، وتحديث الحزم والثغرات الأمنية، ومراقبة الأداء والأمان على مدار الساعة، وتقريراً شهرياً مفصلاً، مع ساعات تطوير إضافية يمكن استخدامها عند الحاجة.\"}},{\"@type\":\"Question\",\"name\":\"كيف تتم اجتماعات المتابعة خلال التنفيذ؟\",\"text\":\"كيف تتم اجتماعات المتابعة خلال التنفيذ؟\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"نعقد اجتماع متابعة أسبوعياً عبر مكالمة فيديو نعرض فيه التقدم المحرز والمرحلة القادمة، ويصلك بعده تقرير مكتوب، ويمكنك متابعة المهام لحظياً عبر لوحة إدارة المشروع في أي وقت.\"}}]}]}6:X\n7:[[\"children\",{\"s\":\"__PAGE__\",\"h\":512,\"d\":{\"r\":\"$L8\",\"p\":fa
